<!-- @dsCard group="Bán hàng" height=260 subtitle="Giá gói bay chính trên ảnh" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Phudu:wght@800&family=Poppins:wght@700;800&display=swap">
<style>
  body { margin: 0; font-family: var(--font-body); }
  .stage { display: flex; gap: var(--space-5); flex-wrap: wrap; padding: var(--space-4); background: linear-gradient(160deg, var(--meadow), var(--forest)); }
  .hero {
    display: inline-flex; flex-direction: column; align-items: center; gap: var(--space-1);
    padding: var(--space-3) var(--space-4); border-radius: var(--radius-glass);
    background: rgba(255, 255, 255, 0.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .pkg { margin: 0; font-weight: 800; font-size: 17px; color: var(--brand-navy); text-transform: uppercase; letter-spacing: .01em; }
  .amount { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 72px; line-height: .9;
    background: linear-gradient(90deg, var(--jade), var(--lagoon)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .amount small { font-size: 32px; }
  .perk { margin-top: var(--space-1); background: var(--royal); color: var(--on-dark); font-weight: 700; font-size: 15px;
    padding: 4px var(--space-3); border-radius: var(--radius-pill); text-transform: uppercase; }
  ul { list-style: none; margin: 0; padding: 0; align-self: center; color: var(--on-dark); font-weight: 700; font-size: 16px; line-height: 1.7; }
</style>
</head>
<body>
<div class="stage">
  <div class="hero">
    <p class="pkg">Dù lượn &amp; dù động cơ</p>
    <p class="amount">2390K<small>$95</small></p>
    <span class="perk">Bao gồm Go Pro</span>
  </div>
  <ul>
    <li>✦ Chuyến bay</li>
    <li>✦ Đưa đón tận nơi</li>
    <li>✦ Bảo hiểm bay</li>
  </ul>
</div>
<script></script>
</body>
</html>
